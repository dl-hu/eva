<!doctype html>
<title>EVA — {{.Code}}</title>
{{template "style" .}}
<main class="wide">
  {{template "nav" .}}
  <p>room <span class="code">{{.Code}}</span> · <span id="status">connecting…</span></p>
  <ol id="results" class="places" hidden></ol>
  <div id="controls" hidden>
    <label>width <input id="w" type="number" min="50" max="1000" value="250"></label>
    <label>height <input id="h" type="number" min="50" max="1000" value="250"></label>
    <button id="start">start</button>
  </div>
  <canvas id="board" hidden></canvas>
  <ul id="players"></ul>
  <a class="back" href="{{.Prefix}}/">← leave</a>
</main>
<script>
  const code = {{.Code}}, name = {{.Name}}, prefix = {{.Prefix}};
  const YOU = "#2f81f7", THEM = "#d8dee9", YOUR_HEAD = "#79c0ff", THEIR_HEAD = "#ffffff";
  const DEAD = "#f97583", BOARD = "#0b0e13";

  const statusEl = document.getElementById("status");
  const controls = document.getElementById("controls");
  const list = document.getElementById("players");
  const canvas = document.getElementById("board");
  const results = document.getElementById("results");
  const ctx = canvas.getContext("2d");

  let me = -1, seat = -1, host = false, cell = 0, heads = new Map(), playing = false;

  // The session cookie rides along with the handshake; the server names us.
  const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") +
    location.host + prefix + "/ws/" + code);
  ws.onopen = () => statusEl.textContent = "connected as " + name;
  ws.onclose = () => { statusEl.textContent = "disconnected"; playing = false; };
  ws.onmessage = (e) => handle(JSON.parse(e.data));

  function handle(msg) {
    switch (msg.type) {
      case "you":
        me = msg.snake;
        seat = msg.seat;
        host = msg.host;
        controls.hidden = !host;
        break;
      case "players":
        list.replaceChildren(...msg.players.map((p) => {
          const li = document.createElement("li");
          li.append(playerEl(p, p.seat === seat));
          return li;
        }));
        break;
      case "start":
        begin(msg);
        break;
      case "tick":
        if (playing) step(msg);
        break;
      case "over":
        playing = false;
        canvas.hidden = true;
        controls.hidden = !host; // the host can set up another round
        statusEl.textContent = msg.winner < 0 ? "nobody made it" : msg.name + " wins";
        showResults(msg.places || []);
        break;
    }
  }

  // playerEl renders one name, in the lobby roster or the scoreboard: you in
  // blue, other account holders in white and linked to their history, guests in
  // grey and inert.
  function playerEl(p, mine) {
    let el;
    if (mine) {
      el = document.createElement("span");
      el.className = "player me";
    } else if (p.user) {
      el = document.createElement("a");
      el.className = "player user";
      el.href = prefix + "/u/" + encodeURIComponent(p.user);
    } else {
      el = document.createElement("span");
      el.className = "player guest";
    }
    el.textContent = p.name; // textContent, so a chosen name cannot be markup
    return el;
  }

  // showResults lists the finishing order.
  function showResults(places) {
    results.replaceChildren(...places.map((p) => {
      const li = document.createElement("li");
      li.value = p.place;
      li.append(playerEl(p, p.snake === me));
      return li;
    }));
    results.hidden = places.length === 0;
  }

  function begin(msg) {
    results.hidden = true;
    cell = Math.max(2, Math.floor(640 / Math.max(msg.w, msg.h)));
    canvas.width = msg.w * cell;
    canvas.height = msg.h * cell;
    canvas.hidden = false;
    controls.hidden = true;
    ctx.fillStyle = BOARD;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    heads = new Map();
    playing = true;
    statusEl.textContent = "go";
    msg.snakes.forEach((s, id) => {
      if (!s.alive) return;
      head(id, s.x, s.y);
    });
  }

  function step(msg) {
    for (const [id, x, y] of msg.moves) {
      const was = heads.get(id);
      if (was) paint(id, was[0], was[1]); // last tick's head is wall now
      head(id, x, y);
    }
    for (const id of msg.dead || []) {
      const was = heads.get(id);
      if (was) fill(was[0], was[1], DEAD);
      heads.delete(id);
      if (id === me) statusEl.textContent = "you crashed";
    }
  }

  const fill = (x, y, color) => {
    ctx.fillStyle = color;
    ctx.fillRect(x * cell, y * cell, cell, cell);
  };
  const paint = (id, x, y) => fill(x, y, id === me ? YOU : THEM);

  // head marks where the snake is now, in a brighter shade than its wall.
  function head(id, x, y) {
    heads.set(id, [x, y]);
    fill(x, y, id === me ? YOUR_HEAD : THEIR_HEAD);
  }

  document.getElementById("start").onclick = () => ws.send(JSON.stringify({
    type: "start",
    w: +document.getElementById("w").value,
    h: +document.getElementById("h").value,
  }));

  const keys = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
  };
  addEventListener("keydown", (e) => {
    const dir = keys[e.key];
    if (!dir || !playing) return;
    e.preventDefault();
    ws.send(JSON.stringify({type: "dir", dir}));
  });
</script>
